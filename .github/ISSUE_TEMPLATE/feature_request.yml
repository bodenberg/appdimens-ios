name: Feature request
description: Propose a compatible API, strategy, integration, or documentation enhancement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete layout or integration problem, not only the proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Apple-native behavior
      description: Explain expected SwiftUI/UIKit usage and Android parity where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: The proposal preserves the single window/scene configuration invariant.
          required: true
        - label: The proposal includes a testable acceptance criterion.
          required: true
