name: Swift

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: iOS SDK build
        run: xcodebuild -scheme AppDimens-Package -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
